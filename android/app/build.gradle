plugins { id 'com.android.application' }

android {
    namespace 'org.supermariowar.app'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.supermariowar.app'
        minSdk 23
        targetSdk 35
        versionCode 28
        // Build number in the name so Settings > Apps shows which build is installed.
        versionName '2.0.0-sdl3-b28'
        ndk { abiFilters 'arm64-v8a' }
    }
    // One debug key for every build (CI runners otherwise make a new one each run),
    // so each new APK installs over the previous one and keeps settings.
    // Debug-only key with the standard debug passwords; not for store releases.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    sourceSets.main {
        java.srcDirs += ['../deps/SDL/android-project/app/src/main/java']
        assets.srcDirs = [layout.buildDirectory.dir('generated/assets')]
        jniLibs.srcDirs = ['../../build-android-arm64/apk-libs']
    }
    buildFeatures { buildConfig true }
}

// Keep the data layout intact: native code enumerates directories and uses stdio.
tasks.register('stageGameAssets', Sync) {
    from('../../data') { into 'data'; exclude '.git', '.git/**' }
    into layout.buildDirectory.dir('generated/assets')
}
tasks.named('preBuild').configure {
    dependsOn 'stageGameAssets'
    doFirst {
        if (!file('../../build-android-arm64/apk-libs/arm64-v8a/libmain.so').isFile()) {
            throw new GradleException('Build native libraries first: ./build.sh')
        }
        if (!file('../../data/gfx').isDirectory()) {
            throw new GradleException('Initialize game data: git submodule update --init --recursive')
        }
    }
}
