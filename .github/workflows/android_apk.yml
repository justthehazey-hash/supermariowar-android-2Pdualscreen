name: Android APK
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # publish debug symbols as a pre-release

jobs:
  apk:
    # Pinned: ubuntu-latest is moving to a new image; 24.04 ships the Android SDK.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Host tests (touch + gamepad input)
        run: ./android/test-touch.sh

      - name: Android SDK, NDK and Ninja
        run: |
          # Report failures as annotations so they are visible without the full log.
          fail() { echo "::error title=Android setup::$1"; exit 1; }
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i: $*"; sleep 15; done; return 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$sdk" ] || [ ! -x "$manager" ]; then
            # Fallback when the runner image has no SDK preinstalled.
            sdk="$HOME/android-sdk"
            mkdir -p "$sdk/cmdline-tools"
            retry curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              || fail "Could not download Android command-line tools"
            unzip -q /tmp/cmdline-tools.zip -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$manager" --licenses > /dev/null || true
          retry "$manager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdkmanager.log 2>&1 \
            || fail "sdkmanager failed: $(tail -c 600 /tmp/sdkmanager.log | tr '\n' ' ')"
          if ! command -v ninja > /dev/null; then
            retry sudo apt-get update -qq || fail "apt-get update failed"
            retry sudo apt-get install -y ninja-build || fail "Could not install ninja-build"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          BUILD_JOBS=4 ./android/build.sh 2>&1 | tee /tmp/build.log || {
            echo "::error title=APK build::$(grep -E 'error|Error|FAILED' /tmp/build.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      # Unstripped native libraries (with debug info) for turning on-device crash
      # reports (library + offset) into function names and source lines.
      - name: Publish debug symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          mkdir -p /tmp/symbols
          find build-android-arm64 -path build-android-arm64/apk-libs -prune -o -name 'lib*.so' -print \
            -exec cp '{}' /tmp/symbols/ \;
          tar czf "/tmp/symbols-$short.tar.gz" -C /tmp/symbols .
          if gh release view "symbols-$short" > /dev/null 2>&1; then
            echo "Debug symbols for $short already published"
            exit 0
          fi
          gh release create "symbols-$short" "/tmp/symbols-$short.tar.gz" --prerelease \
            --target "$GITHUB_SHA" --title "Debug symbols $short" \
            --notes "Unstripped native libraries for crash reports from build $short." \
            || echo "::warning::Could not publish debug symbols"

      - uses: actions/upload-artifact@v5
        with:
          name: supermariowar-android-controllers
          path: android/app/build/outputs/apk/debug/app-debug.apk
